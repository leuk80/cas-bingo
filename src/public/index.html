<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leadership Bingo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Leadership Bingo</h1>
      <p class="subtitle">The Leadership Toolbox</p>
    </header>

    <!-- View: Start -->
    <div id="view-start" class="view active">
      <div class="card start-card">
        <h2>New Game</h2>
        <p>Create a new bingo game and share the code with your colleagues.</p>
        <input type="text" id="host-name" placeholder="Your name" maxlength="20" autocomplete="off">
        <button id="btn-create" class="btn-primary">Create Game</button>
      </div>
      <div class="card start-card">
        <h2>Join Game</h2>
        <p>Enter the room code to join a game.</p>
        <input type="text" id="join-code" placeholder="Room code (e.g. ABC123)" maxlength="6" autocomplete="off">
        <input type="text" id="join-name" placeholder="Your name" maxlength="20" autocomplete="off">
        <button id="btn-join" class="btn-primary">Join</button>
      </div>
    </div>

    <!-- View: Lobby -->
    <div id="view-lobby" class="view">
      <div class="card lobby-card">
        <div class="room-code-display">
          <span class="room-code-label">Room Code</span>
          <span id="room-code" class="room-code-value"></span>
        </div>
        <h2>Players</h2>
        <ul id="player-list" class="player-list"></ul>
        <button id="btn-start" class="btn-primary">Start Game</button>
        <p id="lobby-hint" class="hint">Share the room code with your colleagues</p>
      </div>
    </div>

    <!-- View: Game -->
    <div id="view-game" class="view">
      <div class="game-hint">
        <p>Click a phrase when you hear it in the meeting!</p>
      </div>

      <div id="bingo-card" class="bingo-card"></div>

      <button id="btn-reset" class="btn-secondary">New Game</button>
    </div>

    <!-- Bingo Overlay -->
    <div id="bingo-overlay" class="bingo-overlay">
      <div class="bingo-overlay-content">
        <h1>BINGO!</h1>
        <p id="bingo-winner"></p>
        <button id="btn-close-overlay" class="btn-primary">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
